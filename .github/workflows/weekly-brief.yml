# GitHub Actions workflow — two jobs:
# 1. Run tests on every push to main (catches broken code before it ships)
# 2. Run the full agent pipeline every Sunday 11PM UTC (= Monday 7AM SGT)

name: Stock Agent

on:
  # Trigger 1: every push to main runs the test suite
  push:
    branches: [main]

  # Trigger 2: scheduled run — Sunday 11PM UTC = Monday 7AM SGT
  # Cron format: minute hour day-of-month month day-of-week
  schedule:
    - cron: "0 23 * * 0"

  # Trigger 3: allows you to manually trigger a run from the GitHub UI
  workflow_dispatch:

jobs:
  # ── Job 1: always run tests ──────────────────────────────────────────────
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  # ── Job 2: weekly agent run (scheduled + manual only) ───────────────────
  weekly-brief:
    name: Generate weekly brief
    runs-on: ubuntu-latest
    # Only run on schedule or manual trigger — not on every push
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test  # Don't run the agent if tests are failing

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock agent
        # API keys are stored as GitHub Secrets — never in code
        # Add these in: GitHub repo → Settings → Secrets → Actions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: stock-agent
        # TODO (Stage 6): replace with the actual entry point script
        run: echo "Agent entry point not yet implemented — placeholder"
